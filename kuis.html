    <script>
        const currModule = new URLSearchParams(window.location.search).get('module') || 'cpns1';
        const validTokens = {
            "cpns1": "FREE",
            "cpns2": "MIVIDACPNS2026",
            "cpns3": "MIVIDA12439CPNS3",
            "cpns4": "Akj19ajdCPNS4",
            "cpns5": "1hasfh3SIAhsas91",
            "bumn1": "AKHLAKBUMN2026",
            "utbk1": "123kjas0k2jkaAaj"
        };
        const userToken = sessionStorage.getItem('token_' + currModule);
        
        if (!userToken || userToken !== validTokens[currModule]) {
            alert("Akses Ditolak!\n\nAnda tidak bisa mengakses halaman ini secara langsung tanpa memasukkan Kunci Gembok yang sah dari halaman utama.");

    <style>
        /* Desain UI Anti-Seleksi */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }
        body { background-color: #f1f5f9; color: #0f172a; overflow-x: hidden;}
        
        .cat-header { background: #fff; padding: 15px 30px; border-bottom: 2px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;}

        .btn-home { color: #475569; background: #f1f5f9; padding: 8px 12px; border-radius: 8px; text-decoration: none; margin-right: 5px; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center;}

        .cat-container { display: grid; grid-template-columns: 1fr 320px; gap: 30px; max-width: 1300px; margin: 30px auto; padding: 0 20px; align-items: start;}

        .opsi-list { display: flex; flex-direction: column; gap: 12px; }
        .opsi-label { display: flex; align-items: flex-start; gap: 15px; padding: 15px 20px; border: 1px solid #cbd5e1; border-radius: 12px; cursor: pointer; transition: 0.2s; font-size: 15.5px; }
        .opsi-label:hover { background: #f8fafc; border-color: #94a3b8; }
        .opsi-label input[type="radio"] { margin-top: 4px; transform: scale(1.2); accent-color: #3b82f6;}
        .opsi-label.terpilih { background: #eff6ff; border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6; font-weight: 600;}

        .action-panel { display: flex; justify-content: space-between; gap: 15px; margin-top: 40px; border-top: 1px solid #e2e8f0; padding-top: 25px;}
        .btn { padding: 14px 25px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; border: none; font-size: 14.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;}
        .btn-prev { background: #f1f5f9; color: #475569; } .btn-prev:hover { background: #e2e8f0; }
        .btn-ragu { background: #fef3c7; color: #d97706; } .btn-ragu:hover { background: #fde68a; }
        .btn-next { background: #3b82f6; color: white; } .btn-next:hover { background: #2563eb; }

        .navigasi-panel { background: #fff; border-radius: 20px; padding: 25px; border: 1px solid #e2e8f0; position: sticky; top: 90px;}
        .navigasi-title { font-weight: 800; margin-bottom: 15px; font-size: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;}
        .grid-nomor { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-height: 400px; overflow-y: auto; padding-right: 5px;}
        .grid-nomor::-webkit-scrollbar { width: 5px; }
        .grid-nomor::-webkit-scrollbar-track { background: #f1f5f9; }
        .grid-nomor::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px;}
        
        .btn-nomor { aspect-ratio: 1; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s;}
        .btn-nomor:hover { border-color: #94a3b8; }
        .btn-nomor.dijawab { background: #3b82f6; color: white; border-color: #3b82f6;}

        /* ====== TAMPILAN EVALUASI ====== */
        #hasil-panel { display: none; max-width: 900px; margin: 40px auto; background: #fff; border-radius: 24px; padding: 50px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); border: 1px solid #e2e8f0;}
        .hasil-header { text-align: center; margin-bottom: 40px; }
        .skor-total { font-size: 64px; font-weight: 800; color: #0f172a; margin: 10px 0;}
        
        .eval-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; text-align: center;}
        .eval-box { padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; background: #f8fafc;}
        .eval-box.box1 { border-top: 4px solid #dc2626;}
        .eval-box.box2 { border-top: 4px solid #10b981;}
        .eval-box.box3 { border-top: 4px solid #3b82f6;}
        .eval-nilai { font-size: 24px; font-weight: 800; margin-top: 5px;}
        .eval-status { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 12px; display: inline-block; margin-top: 10px;}
        .status-lulus { background: #d1fae5; color: #065f46; }
        .status-gagal { background: #fee2e2; color: #991b1b; }
        .status-info { background: #e0f2fe; color: #0369a1; }

        .feedback-analisis { background: #fffbeb; border: 1px solid #fcd34d; padding: 25px; border-radius: 16px; font-size: 15px; color: #92400e; margin-bottom: 40px; line-height: 1.7;}
        .feedback-analisis h3 { font-size: 18px; margin-bottom: 15px;}
        .feedback-analisis ul { margin-left: 20px; margin-bottom: 15px;}
        .feedback-analisis li { margin-bottom: 10px; }
        
        .cta-btn-next { display: inline-block; background: #6366f1; color: white; text-decoration: none; font-weight: 800; padding: 15px 30px; border-radius: 10px; transition: 0.3s;}

        .loading-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: #fff; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;}
        .spinner { width: 50px; height: 50px; border: 5px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 992px) {
            .cat-container { grid-template-columns: 1fr; gap: 20px;}
            .navigasi-panel { position: static; }
            .eval-grid { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .action-panel { flex-wrap: wrap; }
            .btn { flex: 1 1 45%; }
            .btn-next { flex: 1 1 100%; order: 3;} 
        }
    </style>

<body oncontextmenu="return false;">

    <script>
        // PENGAMANAN UI
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                e.preventDefault(); return false;
            }
        });

        const moduleUrls = {
            "cpns1": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=1999742481&single=true&output=csv",
            "cpns2": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=177118517&single=true&output=csv",
            "cpns3": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=2124912226&single=true&output=csv",
            "cpns4": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=1284587631&single=true&output=csv",
            "cpns5": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=2039958969&single=true&output=csv",
            "bumn1": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=1111447607&single=true&output=csv",
            "utbk1": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=293930227&single=true&output=csv"
        };

        let currentModuleId = new URLSearchParams(window.location.search).get('module') || 'cpns1';
        let bankSoal = []; 
        let jawabanPeserta = {}; 
        let raguRagu = {}; 
        let indeksSoal = 0;
        
        let durasiMenit = currentModuleId.includes('utbk') ? 195 : (currentModuleId.includes('bumn') ? 120 : 100);
        let totalDetik = durasiMenit * 60;
        let timerInterval;

        function ambilDataSoal() {
            let url = moduleUrls[currentModuleId];

            Papa.parse(url, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    let parsedSoal = [];
                    results.data.forEach((row, index) => {
                        
                        // FUNGSI INI SUDAH DIPERBARUI: ANTI BOM & ANTI SPACE 
                        const getVal = (possibleKeys) => {
                            for (let k of possibleKeys) {
                                for (let key in row) {
                                    // Menghapus \uFEFF (BOM) yang sering menempel di kolom pertama Google Sheet
                                    let cleanKey = key.replace(/^\uFEFF/, '').trim().toLowerCase();
                                    if (cleanKey === k.toLowerCase() && row[key]) {
                                        return row[key].toString().trim();
                                    }
                                }
                            }
                            return "";
                        };

                        let teksSoal = getVal(["soal", "teks soal"]);
                        if (teksSoal !== "") {
                            // Ditambahkan banyak alias untuk berjaga-jaga
                            let kat = getVal(["kategori", "category", "jenis"]);
                            
                            parsedSoal.push({
                                nomor: index + 1, 
                                kategori: kat, 
                                soal: teksSoal,
                                A: getVal(["opsi_a", "opsi a", "a"]), 
                                B: getVal(["opsi_b", "opsi b", "b"]),
                                C: getVal(["opsi_c", "opsi c", "c"]), 
                                D: getVal(["opsi_d", "opsi d", "d"]),
                                E: getVal(["opsi_e", "opsi e", "e"]), 
                                Kunci: getVal(["kunci", "jawaban", "kunci jawaban"])
                            });
                        }
                    });

                    if(parsedSoal.length > 0) {
                        bankSoal = parsedSoal; 
                        siapMulai();
                    } else {
                        alert("Gagal membaca soal dari database. Mohon pastikan header kolom sesuai.");
                    }
                }
            });
        }

        function siapMulai() {
            document.getElementById('loadingScreen').innerHTML = `
                <div style="text-align: center; max-width: 90%; margin: 0 auto;">
                    <i class="fa-solid fa-clipboard-check" style="font-size: 50px; color: #10b981; margin-bottom: 20px;"></i>
                    <h2 style="color: #0f172a; font-size: 22px; margin-bottom: 10px;">Data Siap Diproses!</h2>
                    <p style="color: #64748b; margin-bottom: 25px;">Waktu <b>${durasiMenit} Menit</b> akan dihitung mundur setelah Anda klik tombol di bawah.</p>
                    <button onclick="mulaiUjian()" style="background: #3b82f6; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: 700; border-radius: 10px; cursor: pointer;">
                        <i class="fa-solid fa-play"></i> Mulai Simulasi
                    </button>
                </div>
            `;
        }

        function mulaiUjian() {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('area-ujian').style.display = 'block';
            
            let namaModul = currentModuleId.includes('utbk') ? "UTBK (SNBT)" : (currentModuleId.includes('bumn') ? "BUMN" : "CPNS (SKD)");
            document.getElementById('judul-modul').innerText = "Simulasi CAT " + namaModul;
            
            buatNavigasi();
            tampilkanSoal(0);
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            if(totalDetik <= 0) {
                clearInterval(timerInterval);
                alert("WAKTU HABIS! Lembar jawaban dikumpulkan.");
                kalkulasiHasil();
                return;
            }
            totalDetik--;
            let h = Math.floor(totalDetik / 3600);
            let m = Math.floor((totalDetik % 3600) / 60);
            let s = totalDetik % 60;
            
            document.getElementById('waktu-tersisa').innerText = h > 0 ? `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}` : `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            if(totalDetik < 300) document.getElementById('timerDisplay').classList.add('timer-warning');
        }

        function buatNavigasi() {
            let grid = document.getElementById('grid-nomor');
            grid.innerHTML = '';
            for(let i=0; i<bankSoal.length; i++) {
                let btn = document.createElement('button');
                btn.className = 'btn-nomor';
                btn.id = 'nav-' + i;
                btn.innerText = i + 1;
                btn.onclick = () => tampilkanSoal(i);
                grid.appendChild(btn);
            }
        }

        function tampilkanSoal(indeks) {
            indeksSoal = indeks;
            let soalObj = bankSoal[indeks];
            
            document.querySelectorAll('.btn-nomor').forEach(b => b.classList.remove('aktif'));
            document.getElementById('nav-' + indeks).classList.add('aktif');

            // FALLBACK KATEGORI TAMPILAN:
            let labelKat = soalObj.kategori ? soalObj.kategori.toUpperCase() : "";
            if (labelKat === "") {
                if (indeks < 30) labelKat = "TWK";
                else if (indeks < 65) labelKat = "TIU";
                else labelKat = "TKP";
            }
            document.getElementById('kategori-soal').innerText = `Nomor ${indeks + 1} (${labelKat})`;
            document.getElementById('teks-soal').innerText = soalObj.soal;

            let opsHTML = '';
            ['A', 'B', 'C', 'D', 'E'].forEach(huruf => {
                if(soalObj[huruf] && soalObj[huruf] !== "") {
                    let isChecked = jawabanPeserta[indeks] === huruf;
                    opsHTML += `
                        <label class="opsi-label ${isChecked ? 'terpilih' : ''}" onclick="pilihOpsi(${indeks}, '${huruf}')">
                            <input type="radio" name="opsi" value="${huruf}" ${isChecked ? 'checked' : ''}>
                            <span><strong>${huruf}.</strong> ${soalObj[huruf]}</span>
                        </label>
                    `;
                }
            });
            document.getElementById('opsi-list').innerHTML = opsHTML;

            // Ragu-ragu
            let btnRagu = document.getElementById('btnRagu');
            if(raguRagu[indeks]) {
                btnRagu.innerHTML = '<i class="fa-solid fa-flag"></i> Hapus Ragu';
                btnRagu.style.background = '#f59e0b'; btnRagu.style.color = '#fff';
            } else {
                btnRagu.innerHTML = '<i class="fa-regular fa-flag"></i> Ragu-Ragu';
                btnRagu.style.background = '#fef3c7'; btnRagu.style.color = '#d97706';
            }

            // PERBAIKAN TOMBOL "SELANJUTNYA"
            let btnNext = document.getElementById('btnNext');
            if (indeks === bankSoal.length - 1) {
                btnNext.innerHTML = '<i class="fa-solid fa-check-double"></i> Selesai Ujian';
                btnNext.style.background = '#10b981'; // Ubah warna hijau
            } else {
                btnNext.innerHTML = 'Selanjutnya <i class="fa-solid fa-chevron-right"></i>';
                btnNext.style.background = '#3b82f6'; 
            }
        }

        function pilihOpsi(indeks, huruf) {
            jawabanPeserta[indeks] = huruf;
            let navBtn = document.getElementById('nav-' + indeks);
            if(!raguRagu[indeks]) navBtn.classList.add('dijawab');
            tampilkanSoal(indeks); 
        }

        function tandaiRagu() {
            if(raguRagu[indeksSoal]) {
                raguRagu[indeksSoal] = false;
                if(jawabanPeserta[indeksSoal]) document.getElementById('nav-' + indeksSoal).className = 'btn-nomor dijawab aktif';
                else document.getElementById('nav-' + indeksSoal).className = 'btn-nomor aktif';
            } else {
                raguRagu[indeksSoal] = true;
                document.getElementById('nav-' + indeksSoal).className = 'btn-nomor ragu aktif';
            }
            tampilkanSoal(indeksSoal);
        }

        function gantiSoal(arah) {
            let baru = indeksSoal + arah;
            if (baru >= bankSoal.length) {
                konfirmasiSelesai();
            } else if (baru >= 0) {
                tampilkanSoal(baru);
            }
        }

        function konfirmasiSelesai() {
            let kosong = 0;
            for(let i=0; i<bankSoal.length; i++) { if(!jawabanPeserta[i]) kosong++; }
            
            let msg = kosong > 0 
                ? `Terdapat ${kosong} soal belum Anda jawab.\n\nApakah Anda yakin ingin mengakhiri ujian sekarang?` 
                : "Seluruh soal telah dijawab. Yakin ingin melihat hasil evaluasi?";
                
            if(confirm(msg)) kalkulasiHasil();
        }

        function kalkulasiHasil() {
            clearInterval(timerInterval);
            document.getElementById('area-ujian').style.display = 'none';
            document.getElementById('hasil-panel').style.display = 'block';

            sessionStorage.removeItem('token_' + currentModuleId); 

            let skor1 = 0, skor2 = 0, skor3 = 0, skorTotal = 0;
            
            // LOGIKA SKORING BKN ASLI - SUDAH DIPERBAIKI TOTAL
            for(let i=0; i<bankSoal.length; i++) {
                let soal = bankSoal[i];
                let jawab = jawabanPeserta[i];
                if (!jawab) continue; // Skip jika peserta tidak mengisi nomor ini
                
                let jawabStr = jawab.trim().toUpperCase();
                
                // Mencegah error jika kunci mengandung spasi atau titik, ambil huruf alphabet pertamanya saja
                let kunciMentah = soal.Kunci ? soal.Kunci.toUpperCase().replace(/[^A-E]/g, '') : "";
                let kunciStr = kunciMentah.length > 0 ? kunciMentah[0] : "";
                
                // BACKUP PLAN KATEGORI (Jika kolom Kategori error dibaca dari Excel)
                let kat = soal.kategori ? soal.kategori.toUpperCase() : "";
                if (kat === "") {
                    if (i < 30) kat = "TWK";
                    else if (i < 65) kat = "TIU";
                    else kat = "TKP";
                }

                if (currentModuleId.includes('bumn')) {
                    if (kat.includes('TKD') && jawabStr === kunciStr) skor1 += 5;
                    if (kat.includes('AKHLAK')) {
                        if (jawabStr === kunciStr) skor2 += 5;
                        else skor2 += Math.floor(Math.random() * 4) + 1; 
                    }
                } 
                else if (currentModuleId.includes('utbk')) {
                    if (kat.includes('TPS') && jawabStr === kunciStr) skor1 += 1;
                    if (kat.includes('LITERASI') && jawabStr === kunciStr) skor2 += 1;
                } 
                else { 
                    // ===== CPNS SKD =====
                    if (kat.includes('TWK')) {
                        if (jawabStr === kunciStr) skor1 += 5;
                    } 
                    else if (kat.includes('TIU')) {
                        if (jawabStr === kunciStr) skor2 += 5;
                    } 
                    else if (kat.includes('TKP')) {
                        if (jawabStr === kunciStr) {
                            skor3 += 5; 
                        } else {
                            // Karena Kunci di Excel hanya ada poin 5, simulasi acak 1-4 untuk pilihan lainnya
                            skor3 += Math.floor(Math.random() * 4) + 1; 
                        }
                    }
                }
            }

            skorTotal = skor1 + skor2 + skor3;
            document.getElementById('skor-total-akhir').innerText = skorTotal;

            let stringAnalisis = "<ul>";

            if (currentModuleId.includes('bumn')) {
                document.getElementById('title-eval-1').innerText = "SKOR TKD";
                document.getElementById('skor-box-1').innerText = skor1;
                setPassStatus('status-box-1', skor1, 150);

                document.getElementById('title-eval-2').innerText = "SKOR AKHLAK";
                document.getElementById('skor-box-2').innerText = skor2;
                setPassStatus('status-box-2', skor2, 195); 

                document.getElementById('kard-3').style.display = 'none';
                document.getElementById('eval-grid-container').style.gridTemplateColumns = 'repeat(2, 1fr)';

                stringAnalisis += (skor1 < 150) ? "<li><b><i class='fa-solid fa-triangle-exclamation'></i> Evaluasi TKD:</b> Logika spasial/deret Anda masih di bawah standar.</li>" : "<li><b><i class='fa-solid fa-check-circle' style='color:#10b981'></i> Keunggulan TKD:</b> Kapasitas kognitif Anda memuaskan!</li>";
                stringAnalisis += (skor2 < 195) ? "<li><b><i class='fa-solid fa-triangle-exclamation'></i> Evaluasi AKHLAK:</b> Jawaban Anda belum sepenuhnya selaras Core Values BUMN.</li>" : "<li><b><i class='fa-solid fa-check-circle' style='color:#10b981'></i> Keunggulan AKHLAK:</b> Insting Core Values Anda tajam.</li>";
                
            } else if (currentModuleId.includes('utbk')) {
                document.getElementById('title-eval-1').innerText = "BENAR TPS";
                document.getElementById('skor-box-1').innerText = skor1 + " Benar";
                document.getElementById('status-box-1').innerText = "Diukur IRT";
                document.getElementById('status-box-1').className = 'eval-status status-info';

                document.getElementById('title-eval-2').innerText = "BENAR LITERASI";
                document.getElementById('skor-box-2').innerText = skor2 + " Benar";
                document.getElementById('status-box-2').innerText = "Diukur IRT";
                document.getElementById('status-box-2').className = 'eval-status status-info';
                
                document.getElementById('kard-3').style.display = 'none';
                document.getElementById('eval-grid-container').style.gridTemplateColumns = 'repeat(2, 1fr)';

                stringAnalisis += "<li>Penilaian Aktual UTBK SNBT menggunakan sistem **IRT (Item Response Theory)**.</li>";

            } else {
                // Tampilan Hasil CPNS
                document.getElementById('skor-box-1').innerText = skor1;
                setPassStatus('status-box-1', skor1, 65);

                document.getElementById('skor-box-2').innerText = skor2;
                setPassStatus('status-box-2', skor2, 80);

                document.getElementById('skor-box-3').innerText = skor3;
                setPassStatus('status-box-3', skor3, 166);

                stringAnalisis += (skor1 < 65) ? "<li><b>Kelemahan TWK:</b> Hafalan tidak cukup, tingkatkan penalaran studi kasus Pancasila Anda.</li>" : "<li><b><i class='fa-solid fa-check-circle' style='color:#10b981'></i> TWK:</b> Insting Nasionalisme Anda lolos Passing Grade.</li>";
                stringAnalisis += (skor2 < 80) ? "<li><b>Kelemahan TIU:</b> Terlalu lama di hitungan, percepat cara skimming analitik Anda.</li>" : "<li><b><i class='fa-solid fa-check-circle' style='color:#10b981'></i> TIU:</b> Kecepatan logika kuantitatif Anda menjanjikan.</li>";
                stringAnalisis += (skor3 < 166) ? "<li><b>Kelemahan TKP:</b> Anda belum memilih solusi dengan prioritas Pelayanan Publik terbaik.</li>" : "<li><b><i class='fa-solid fa-check-circle' style='color:#10b981'></i> TKP:</b> Pola pikir birokrasi Anda stabil.</li>";
            }

            stringAnalisis += "</ul>";
            document.getElementById('teks-analisis').innerHTML = stringAnalisis;
        }

        function setPassStatus(elementId, skor, batas) {
            let el = document.getElementById(elementId);
            if(skor >= batas) {
                el.innerText = `LULUS (Min. ${batas})`;
                el.className = 'eval-status status-lulus';
            } else {
                el.innerText = `TIDAK LULUS (Min. ${batas})`;
                el.className = 'eval-status status-gagal';
            }
        }
        
        ambilDataSoal();
    </script>
</body>
</html>
