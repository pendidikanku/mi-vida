    <script>
        const currModule = new URLSearchParams(window.location.search).get('module') || 'cpns1';
        
        // Obfuscation: Token disandikan menggunakan Base64
        const validTokensEncoded = {
            "cpns1": "RlJFRQ==",                   // FREE
            "cpns2": "TUlWSURBQ1BOUzIwMjY=",       // MIVIDACPNS2026
            "cpns3": "TUlWSURBMTI0MzlDUE5TMw==",   // MIVIDA12439CPNS3
            "cpns4": "QWtqMTlhamRDUG5TNA==",       // Akj19ajdCPNS4
            "cpns5": "MWhhc2ZoM1NJQWhzYXM5MQ==",   // 1hasfh3SIAhsas91
            "cpns6": "c2FkMTI5c2Foa2xTQUtI",       // sad129sahklSAKH
            "cpns7": "QVMqJiFrYXNqYSpIQVNr",       // AS*&!kasja*HASk
            "bumn1": "QUtITEFLQlVNTjIwMjY=",       // AKHLAKBUMN2026
            "utbk1": "MTIza2phczBrMmprYUFhag=="    // 123kjas0k2jkaAaj
        };
        
        const userToken = sessionStorage.getItem('token_' + currModule);
        
        // Validasi
        if (!userToken || btoa(userToken) !== validTokensEncoded[currModule]) {
            alert("Sesi Tidak Sah atau Token Kunci salah! Harap mulai dari portal utama.");
            window.location.href = "/"; 
        }
    </script>

    <script>
        // === PROTEKSI UI ===
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('keydown', function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                e.preventDefault(); return false;
            }
        });

        const moduleUrls = {
            "cpns1": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=1999742481&single=true&output=csv",
            "cpns2": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=177118517&single=true&output=csv",
            "cpns3": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=2124912226&single=true&output=csv",
            "cpns4": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=1284587631&single=true&output=csv",
            "cpns5": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=2039958969&single=true&output=csv",
            "cpns6": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=235989538&single=true&output=csv",
            "cpns7": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=2031764124&single=true&output=csv",
            "bumn1": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=1111447607&single=true&output=csv",
            "utbk1": "https://docs.google.com/spreadsheets/d/e/2PACX-1vTTT7q1J0uPg7HDQ48JydQFZmZj5hro3QFjAq_4eGNKeNvcSs49M1kAU6kt93Jpe8haqeuvAPeC3THB/pub?gid=293930227&single=true&output=csv"
        };

        let currentModuleId = new URLSearchParams(window.location.search).get('module') || 'cpns1';
        let bankSoal = [], jawabanPeserta = {}, raguRagu = {}, indeksSoal = 0;
        let durasiMenit = 100, totalDetik = 0, timerInterval;

        // === FUNGSI SISTEM ANTI-REFRESH ===
        function simpanSesiUjian() {
            sessionStorage.setItem('jawaban_' + currentModuleId, JSON.stringify(jawabanPeserta));
            sessionStorage.setItem('ragu_' + currentModuleId, JSON.stringify(raguRagu));
            sessionStorage.setItem('waktu_' + currentModuleId, totalDetik);
            sessionStorage.setItem('indeks_' + currentModuleId, indeksSoal);
        }

        function muatSesiUjian() {
            let sJawab = sessionStorage.getItem('jawaban_' + currentModuleId);
            if(sJawab) jawabanPeserta = JSON.parse(sJawab);

            let sRagu = sessionStorage.getItem('ragu_' + currentModuleId);
            if(sRagu) raguRagu = JSON.parse(sRagu);

            let sWaktu = sessionStorage.getItem('waktu_' + currentModuleId);
            if(sWaktu) totalDetik = parseInt(sWaktu);

            let sIndeks = sessionStorage.getItem('indeks_' + currentModuleId);
            if(sIndeks) indeksSoal = parseInt(sIndeks);
        }

        function ambilDataSoal() {
            Papa.parse(moduleUrls[currentModuleId], {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    let parsedSoal = [];
                    results.data.forEach((row, index) => {
                        const getVal = (possibleKeys) => {
                            for (let k of possibleKeys) {
                                for (let key in row) {
                                    if (key.replace(/^\uFEFF/, '').trim().toLowerCase() === k.toLowerCase() && row[key]) 
                                        return row[key].toString().trim();
                                }
                            }
                            return "";
                        };
                        let teksSoal = getVal(["soal", "teks soal"]);
                        if (teksSoal !== "") {
                            parsedSoal.push({
                                nomor: index + 1, kategori: getVal(["kategori", "category", "jenis"]), 
                                soal: teksSoal, A: getVal(["opsi_a", "a"]), B: getVal(["opsi_b", "b"]),
                                C: getVal(["opsi_c", "c"]), D: getVal(["opsi_d", "d"]), E: getVal(["opsi_e", "e"]), 
                                Kunci: getVal(["kunci", "jawaban", "kunci jawaban"])
                            });
                        }
                    });

                    if(parsedSoal.length > 0) {
                        bankSoal = parsedSoal; 
                        
                        // Cek apakah ada sesi berjalan sebelum menanyakan durasi
                        let sWaktu = sessionStorage.getItem('waktu_' + currentModuleId);
                        if(sWaktu && parseInt(sWaktu) > 0) {
                            muatSesiUjian();
                            resumeWaktuUjian();
                        } else {
                            tampilkanKonfigurasiWaktu();
                        }
                    } else {
                        alert("Gagal membaca bank soal dari sistem.");
                    }
                }
            });
        }

        function tampilkanKonfigurasiWaktu() {
            let isCPNS = currentModuleId.includes('cpns');
            if (isCPNS) {
                document.getElementById('loadingScreen').innerHTML = `
                    <div class="waktu-card">
                        <div style="text-align:center;">
                            <i class="fa-solid fa-stopwatch" style="font-size: 50px; color: #3b82f6; margin-bottom: 20px;"></i>
                            <h2>Penguasaan Manajemen Waktu</h2>
                            <p style="color: #64748b; margin-bottom: 30px; font-size: 15px; font-weight: 500; line-height: 1.6;">
                                Jadikan simulasi ini sebagai <strong>gladi bersih psikologis</strong> Anda. Dalam tes CAT asli, tekanan waktu adalah musuh terbesar. Pilih tingkat kesulitan waktu di bawah ini.
                            </p>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 20px;">
                            <button onclick="setWaktuMulai(100)" class="waktu-btn primary">100 Menit (Waktu Asli BKN)</button>
                            <button onclick="setWaktuMulai(90)" class="waktu-btn warning">90 Menit (Tingkat Menengah)</button>
                            <button onclick="setWaktuMulai(80)" class="waktu-btn danger">80 Menit (Tingkat Ekstrem)</button>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <input type="number" id="inputCustom" placeholder="Custom (Menit)" style="flex: 1; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; font-weight: 700; outline: none;">
                            <button onclick="setCustomWaktu()" style="padding: 12px 25px; background: #0f172a; color: white; border: none; border-radius: 8px; font-weight: 800; cursor: pointer;">SET</button>
                        </div>
                    </div>
                `;
            } else {
                durasiMenit = currentModuleId.includes('utbk') ? 195 : 120;
                setWaktuMulai(durasiMenit);
            }
        }

        function setCustomWaktu() {
            let val = parseInt(document.getElementById('inputCustom').value);
            if(val >= 10 && val <= 200) setWaktuMulai(val);
            else alert("Masukkan waktu antara 10 - 200 menit.");
        }

        function setWaktuMulai(menit) {
            totalDetik = menit * 60;
            mulaiUjianUI();
        }

        function resumeWaktuUjian() {
            mulaiUjianUI();
        }

        function mulaiUjianUI() {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('area-ujian').style.display = 'block';
            
            let namaModul = currentModuleId.includes('utbk') ? "SNBT" : (currentModuleId.includes('bumn') ? "BUMN" : "SKD CPNS");
            document.getElementById('judul-modul').innerText = "SISTEM CAT " + namaModul;
            
            buatNavigasi();
            tampilkanSoal(indeksSoal); // Tampilkan index dari session
            timerInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            if(totalDetik <= 0) {
                clearInterval(timerInterval);
                alert("WAKTU UJIAN HABIS!\nSistem akan mengumpulkan jawaban Anda secara otomatis.");
                kalkulasiHasil();
                return;
            }
            totalDetik--;
            simpanSesiUjian(); // Simpan detik secara konstan

            let h = Math.floor(totalDetik / 3600), m = Math.floor((totalDetik % 3600) / 60), s = totalDetik % 60;
            document.getElementById('waktu-tersisa').innerText = h > 0 ? `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}` : `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            
            if(totalDetik < 300) document.getElementById('timerDisplay').classList.add('timer-warning');
        }

        function buatNavigasi() {
            let grid = document.getElementById('grid-nomor');
            grid.innerHTML = '';
            for(let i=0; i<bankSoal.length; i++) {
                let btn = document.createElement('button');
                btn.className = 'btn-nomor'; btn.id = 'nav-' + i; btn.innerText = i + 1;
                
                // Warnai navigasi berdasarkan sesi yang dimuat
                if(raguRagu[i]) btn.classList.add('ragu');
                else if (jawabanPeserta[i]) btn.classList.add('dijawab');
                
                btn.onclick = () => tampilkanSoal(i);
                grid.appendChild(btn);
            }
        }

        function tampilkanSoal(indeks) {
            indeksSoal = indeks;
            simpanSesiUjian(); // Simpan history navigasi

            let soalObj = bankSoal[indeks];
            
            document.querySelectorAll('.btn-nomor').forEach(b => b.classList.remove('aktif'));
            document.getElementById('nav-' + indeks).classList.add('aktif');

            let labelKat = soalObj.kategori ? soalObj.kategori.toUpperCase() : (indeks < 30 ? "TWK" : (indeks < 65 ? "TIU" : "TKP"));
            document.getElementById('kategori-soal').innerText = `${labelKat} - SOAL KE ${indeks + 1}`;
            document.getElementById('teks-soal').innerText = soalObj.soal;

            let opsHTML = '';
            ['A', 'B', 'C', 'D', 'E'].forEach(huruf => {
                if(soalObj[huruf]) {
                    let isChecked = jawabanPeserta[indeks] === huruf;
                    opsHTML += `
                        <label class="opsi-label ${isChecked ? 'terpilih' : ''}" onclick="pilihOpsi(${indeks}, '${huruf}')">
                            <input type="radio" name="opsi" value="${huruf}" ${isChecked ? 'checked' : ''}>
                            <span><strong>${huruf}.</strong> ${soalObj[huruf]}</span>
                        </label>
                    `;
                }
            });
            document.getElementById('opsi-list').innerHTML = opsHTML;

            let btnRagu = document.getElementById('btnRagu');
            if(raguRagu[indeks]) {
                btnRagu.innerHTML = '<i class="fa-solid fa-flag"></i> HILANGKAN RAGU';
                btnRagu.style.background = '#f59e0b'; btnRagu.style.color = '#fff'; btnRagu.style.borderColor = '#d97706';
            } else {
                btnRagu.innerHTML = '<i class="fa-regular fa-flag"></i> RAGU-RAGU';
                btnRagu.style.background = '#fef3c7'; btnRagu.style.color = '#b45309'; btnRagu.style.borderColor = '#f59e0b';
            }

            let btnNext = document.getElementById('btnNext');
            if (indeks === bankSoal.length - 1) {
                btnNext.innerHTML = 'SELESAI <i class="fa-solid fa-check"></i>';
                btnNext.style.background = '#10b981'; btnNext.style.borderColor = '#059669';
            } else {
                btnNext.innerHTML = 'SELANJUTNYA <i class="fa-solid fa-arrow-right"></i>';
                btnNext.style.background = '#3b82f6'; btnNext.style.borderColor = '#2563eb';
            }
        }

        function pilihOpsi(indeks, huruf) {
            jawabanPeserta[indeks] = huruf;
            
            let navBtn = document.getElementById('nav-' + indeks);
            if(!raguRagu[indeks]) navBtn.className = 'btn-nomor dijawab aktif';
            
            simpanSesiUjian(); // Simpan jawaban secara instan
            tampilkanSoal(indeks); 
        }

        function tandaiRagu() {
            raguRagu[indeksSoal] = !raguRagu[indeksSoal];
            
            let nav = document.getElementById('nav-' + indeksSoal);
            if(raguRagu[indeksSoal]) {
                nav.className = 'btn-nomor ragu aktif';
            } else {
                nav.className = jawabanPeserta[indeksSoal] ? 'btn-nomor dijawab aktif' : 'btn-nomor aktif';
            }
            
            simpanSesiUjian(); // Simpan status ragu-ragu
            tampilkanSoal(indeksSoal);
        }

        function gantiSoal(arah) {
            let baru = indeksSoal + arah;
            if (baru >= bankSoal.length) konfirmasiSelesai();
            else if (baru >= 0) tampilkanSoal(baru);
        }

        function konfirmasiSelesai() {
            let kosong = bankSoal.length - Object.keys(jawabanPeserta).length;
            let msg = kosong > 0 
                ? `Peringatan: Ada ${kosong} soal belum terjawab.\n\nAkhiri ujian sekarang?` 
                : "Anda telah mengisi seluruh soal.\n\nSimpan dan hitung evaluasi?";
            if(confirm(msg)) kalkulasiHasil();
        }

        function kalkulasiHasil() {
            clearInterval(timerInterval);
            document.getElementById('area-ujian').style.display = 'none';
            document.getElementById('hasil-panel').style.display = 'block';
            
            // Hapus semua storage agar sesi bisa dimulai ulang
            sessionStorage.removeItem('token_' + currentModuleId); 
            sessionStorage.removeItem('jawaban_' + currentModuleId);
            sessionStorage.removeItem('ragu_' + currentModuleId);
            sessionStorage.removeItem('waktu_' + currentModuleId);
            sessionStorage.removeItem('indeks_' + currentModuleId);

            let skor1 = 0, skor2 = 0, skor3 = 0;
            
            for(let i=0; i<bankSoal.length; i++) {
                let soal = bankSoal[i];
                if (!jawabanPeserta[i]) continue;
                
                let jawab = jawabanPeserta[i].trim().toUpperCase();
                let kunci = (soal.Kunci || "").toUpperCase().replace(/[^A-E]/g, '')[0] || "";
                let kat = (soal.kategori || "").toUpperCase() || (i < 30 ? "TWK" : (i < 65 ? "TIU" : "TKP"));

                if (currentModuleId.includes('bumn')) {
                    if (kat.includes('TKD') && jawab === kunci) skor1 += 5;
                    if (kat.includes('AKHLAK')) skor2 += (jawab === kunci) ? 5 : Math.floor(Math.random()*4)+1; 
                } else if (currentModuleId.includes('utbk')) {
                    if (kat.includes('TPS') && jawab === kunci) skor1 += 1;
                    if (kat.includes('LITERASI') && jawab === kunci) skor2 += 1;
                } else { 
                    if (kat.includes('TWK') && jawab === kunci) skor1 += 5;
                    else if (kat.includes('TIU') && jawab === kunci) skor2 += 5;
                    else if (kat.includes('TKP')) skor3 += (jawab === kunci) ? 5 : Math.floor(Math.random()*4)+1;
                }
            }

            document.getElementById('skor-total-akhir').innerText = skor1 + skor2 + skor3;

            if (currentModuleId.includes('bumn')) {
                document.getElementById('title-eval-1').innerText = "SKOR TKD"; document.getElementById('skor-box-1').innerText = skor1;
                document.getElementById('title-eval-2').innerText = "SKOR AKHLAK"; document.getElementById('skor-box-2').innerText = skor2;
                document.getElementById('kard-3').style.display = 'none';
                document.getElementById('eval-grid-container').style.gridTemplateColumns = 'repeat(2, 1fr)';
                setPassStatus('status-box-1', skor1, 150, true); setPassStatus('status-box-2', skor2, 195, true);
            } else if (currentModuleId.includes('utbk')) {
                document.getElementById('title-eval-1').innerText = "BENAR TPS"; document.getElementById('skor-box-1').innerText = skor1;
                document.getElementById('title-eval-2').innerText = "BENAR LITERASI"; document.getElementById('skor-box-2').innerText = skor2;
                document.getElementById('kard-3').style.display = 'none';
                document.getElementById('eval-grid-container').style.gridTemplateColumns = 'repeat(2, 1fr)';
                document.getElementById('status-box-1').innerText = "Skoring IRT"; document.getElementById('status-box-2').innerText = "Skoring IRT";
            } else {
                document.getElementById('skor-box-1').innerText = skor1; setPassStatus('status-box-1', skor1, 65, true);
                document.getElementById('skor-box-2').innerText = skor2; setPassStatus('status-box-2', skor2, 80, true);
                document.getElementById('skor-box-3').innerText = skor3; setPassStatus('status-box-3', skor3, 166, true);
            }
        }

        function setPassStatus(elementId, skor, batas, showPG) {
            let el = document.getElementById(elementId);
            el.innerText = skor >= batas ? `MEMENUHI PG (Min ${batas})` : `GAGAL PG (Min ${batas})`;
            el.style.color = skor >= batas ? "#10b981" : "#dc2626";
        }
        
        ambilDataSoal();
    </script>
</body>
</html>
